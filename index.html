<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>CLIMA TÁCTICO // Centro de Riesgos</title>
<meta name="description" content="Mapa táctico de riesgos meteorológicos y geológicos en México y el mundo: sismos, ciclones, incendios, inundaciones, volcanes y pronóstico a 7 días." />
<link rel="stylesheet" href="./vendor/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?famhily=Oxanium:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b0a; --bg2:#0b1211; --panel:rgba(9,16,14,.86);
    --line:rgba(70,224,160,.16); --line-strong:rgba(70,224,160,.34);
    --amber:#ffb000; --amber-dim:#9d7212;
    --green:#46e0a0; --cyan:#3fd0e0; --orange:#ff8c2b; --red:#ff4242; --violet:#b56cff;
    --text:#cfe9df; --muted:#6f8a82;
    --mono:'Share Tech Mono',ui-monospace,monospace;
    --disp:'Oxanium',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--mono);overflow:hidden;-webkit-text-size-adjust:100%}
  #map{position:absolute;inset:0;background:var(--bg);z-index:1}

  /* ---- ambient tactical framing (signature) ---- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:400}
  #fx .grid{position:absolute;inset:0;opacity:.5;
    background:
      linear-gradient(var(--line) 1px,transparent 1px) 0 0/64px 64px,
      linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/64px 64px;
    mask-image:radial-gradient(120% 110% at 50% 45%,#000 55%,transparent 100%)}
  #fx .scan{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(70,224,160,.05) 0 2px,transparent 2px 4px);
    animation:scan 9s linear infinite}
  #fx .vig{position:absolute;inset:0;
    box-shadow:inset 0 0 240px rgba(0,0,0,.85);
    background:radial-gradient(130% 120% at 50% 40%,transparent 60%,rgba(0,0,0,.55))}
  .bracket{position:fixed;width:26px;height:26px;border:2px solid var(--amber);z-index:401;
    pointer-events:none;opacity:.7;filter:drop-shadow(0 0 4px rgba(255,176,0,.4))}
  .bracket.tl{top:8px;left:8px;border-right:0;border-bottom:0}
  .bracket.tr{top:8px;right:8px;border-left:0;border-bottom:0}
  .bracket.bl{bottom:8px;left:8px;border-right:0;border-top:0}
  .bracket.br{bottom:8px;right:8px;border-left:0;border-top:0}
  @keyframes scan{to{background-position:0 64px}}

  /* ---- top HUD ---- */
  .hud-top{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;
    gap:14px;padding:9px 46px;background:linear-gradient(180deg,rgba(7,11,10,.94),rgba(7,11,10,.55));
    border-bottom:1px solid var(--line-strong);backdrop-filter:blur(3px)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .dish{width:26px;height:26px;flex:0 0 auto;color:var(--amber)}
  .dish .sweep{transform-origin:14px 14px;animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:3px;
    margin:0;color:var(--amber);text-shadow:0 0 10px rgba(255,176,0,.35);white-space:nowrap}
  .brand h1 b{color:var(--green);font-weight:800}
  .brand .sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:1px}
  .clocks{margin-left:auto;display:flex;gap:18px;align-items:center;text-align:right}
  .clk b{display:block;font-family:var(--disp);font-size:15px;color:var(--text);letter-spacing:1px}
  .clk span{font-size:9px;color:var(--muted);letter-spacing:2px}
  .refresh{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--green);
    border:1px solid var(--line-strong);padding:5px 10px;border-radius:2px;white-space:nowrap}
  .refresh .dot{width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .refresh.err{color:var(--red)} .refresh.err .dot{background:var(--red);box-shadow:0 0 8px var(--red)}

  /* ---- side panels ---- */
  .panel{position:fixed;z-index:500;width:268px;background:var(--panel);
    border:1px solid var(--line-strong);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px)}
  .panel-left{top:62px;left:10px}
  .panel-right{top:62px;right:10px}
  .panel h2{font-family:var(--disp);font-size:12px;letter-spacing:3px;color:var(--amber);
    margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;background:rgba(255,176,0,.05)}
  .panel h2 .ct{font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:.5px;font-weight:600}
  .panel .body{overflow:auto;padding:6px 6px 8px;flex:1;min-height:0}

  .layer{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:2px;cursor:pointer;
    border:1px solid transparent}
  .layer:hover{background:rgba(70,224,160,.06);border-color:var(--line)}
  .layer.off{opacity:.4}
  .sw{width:13px;height:13px;flex:0 0 auto;border-radius:2px;border:1px solid rgba(255,255,255,.25)}
  .layer .nm{flex:1;min-width:0}
  .layer .nm b{display:block;font-size:12px;color:var(--text);letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .layer .nm span{font-size:9px;color:var(--muted);letter-spacing:1px}
  .layer .cnt{font-family:var(--disp);font-size:13px;color:var(--green);min-width:28px;text-align:right}
  .layer.live .cnt{color:var(--amber)}

  .card{border-top:1px solid var(--line);padding:9px 11px}
  .card .ch{font-family:var(--disp);font-size:11px;letter-spacing:2px;color:var(--amber);margin-bottom:6px}
  .card .cnote{font-size:10px;color:var(--muted);line-height:1.55;margin-top:4px}
  .card .cnote b{color:var(--text)}
  .card .chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:1px;padding:2px 8px;
    border:1px solid;border-radius:2px;background:rgba(255,255,255,.03)}
  .card .kp{font-size:10px;color:var(--cyan);letter-spacing:1px;margin-left:auto}
  .zone .zrow{display:flex;gap:6px;margin-bottom:6px}
  .zone input{flex:1;min-width:0;background:#060a09;border:1px solid var(--line-strong);color:var(--text);
    font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:2px}
  .zone input:focus{outline:1px solid var(--amber)}
  .zone button{background:var(--amber);color:#06100d;border:0;font-weight:700;padding:0 12px;
    border-radius:2px;cursor:pointer;font-family:var(--disp)}
  .advbig{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.5px;margin:2px 0 3px}
  #zres a{color:var(--green)}
  .fitem{display:block;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px;
    color:var(--text);text-decoration:none;line-height:1.4}
  .fitem:hover{color:var(--amber)}
  .fitem .fs{display:block;font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.5px}
  .legend{padding:8px 10px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.7}
  .legend .row{display:flex;align-items:center;gap:7px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* ---- threat board ---- */
  .threat{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:8px 9px;border-bottom:1px solid var(--line);color:var(--text);font-family:var(--mono)}
  .threat:hover{background:rgba(255,176,0,.07)}
  .panel h2 .ct{f.threat .top{display:flex;align-items:flex-start;gap:7px;margin-bottom:3px}ont-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:.5px;font-weight:600}
  .threat .tag{font-size:9px;font-family:var(--disp);font-weight:700;letter-spacing:1px;
    padding:1px 6px;border-radius:2px;color:#06100d}
  .threat .sev{margin-left:auto;flex:none;font-family:var(--disp);font-weight:800;font-size:14px}
  .threat .ttl{font-size:12px;color:var(--text);white-space:normal;overflow:visible;word-break:break-word;flex:1;min-width:0;line-height:1.35}
  .threat .meta{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-top:2px}
  .empty{padding:18px 12px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}

  /* ---- bottom ticker ---- */
  .hud-bottom{position:fixed;bottom:0;left:0;right:0;z-index:500;height:26px;display:flex;
    align-items:center;gap:12px;padding:0 46px;background:linear-gradient(0deg,rgba(7,11,10,.95),rgba(7,11,10,.4));
    border-top:1px solid var(--line);font-size:13px;color:var(--text);overflow:hidden;letter-spacing:.4px}
  .hud-bottom .tk{white-space:nowrap;animation:tick 68s linear infinite}
  @keyframes tick{from{transform:translateX(40vw)}to{transform:translateX(-100%)}}
  .hud-bottom b{color:var(--green)}

  /* ---- panel collapse toggles (mobile) ---- */
  .ptog{display:none;position:fixed;z-index:501;bottom:34px;font-family:var(--disp);font-weight:700;
    font-size:11px;letter-spacing:2px;color:var(--amber);background:var(--panel);
    border:1px solid var(--line-strong);padding:9px 13px;border-radius:2px}
  .ptog.l{left:10px} .ptog.r{right:10px}

  /* ---- Leaflet overrides ---- */
  .leaflet-container{background:var(--bg);font-family:var(--mono)}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--amber)!important;
    border:1px solid var(--line-strong)!important}
  .leaflet-control-attribution{background:rgba(7,11,10,.7)!important;color:var(--muted)!important;font-size:9px}
  .leaflet-control-attribution a{color:var(--green)!important}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border:1px solid var(--amber);
    border-radius:2px;box-shadow:0 0 22px rgba(0,0,0,.7)}
  .leaflet-popup-tip{background:var(--amber)}
  .leaflet-popup-content{margin:11px 13px;font-family:var(--mono);font-size:12px;line-height:1.55}
  .pp h3{font-family:var(--disp);font-size:14px;letter-spacing:1.5px;margin:0 0 6px;color:var(--amber)}
  .pp .k{color:var(--muted)} .pp b{color:var(--text)}
  .pp a{color:var(--green)}
  .pp .ptag{display:inline-block;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:1px;
    padding:1px 7px;border-radius:2px;color:#06100d;margin-bottom:6px}
  .fc{display:flex;gap:3px;margin-top:8px;align-items:flex-end}
  .fc .d{flex:1;text-align:center}
  .fc .bar{margin:0 auto;width:11px;background:var(--cyan);border-radius:1px 1px 0 0;min-height:2px;
    box-shadow:0 0 6px rgba(63,208,224,.4)}
  .fc .dl{font-size:8px;color:var(--muted);margin-top:3px}
  .fc .mm{font-size:8px;color:var(--cyan)}

  /* pulse marker for live, notable events */
  .ping{position:relative}
  .ping .core{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .ping .ring{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;border:2px solid var(--amber);animation:ping 2.4s ease-out infinite}
  .ping.tsu .core{background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
  .ping.tsu .ring{border-color:var(--cyan)}
  @keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(7)}}
  .storm{font-size:18px;color:var(--cyan);text-shadow:0 0 8px rgba(63,208,224,.6);animation:spin 3.5s linear infinite}

  @media (prefers-reduced-motion: reduce){
    #fx .scan,.dish .sweep,.ping .ring,.storm,.hud-bottom .tk,.refresh .dot{animation:none}
  }
  @media (max-width:820px){
    .hud-top{padding:7px 16px;gap:8px}
    .brand .sub{display:none}
    .clocks{gap:10px}
    .panel{max-height:46vh;max-height:46dvh;width:min(86vw,300px);transition:transform .25s}
    .panel-left.hide{transform:translateX(-118%)}
    .panel-right.hide{transform:translateX(118%)}
    .ptog{display:block}
    .bracket{display:none}
  }
@media (max-width:820px){
.zone input{font-size:16px}
.threat{padding:10px 9px}
.ptog{padding:11px 15px;font-size:12px}
}

</style>
</head>

function eqColor(m){ return m>=6?C.red : m>=4.5?C.orange : m>=2.5?C.amber : C.green; }
function fmtAgo(ms){ const s=(Date.now()-ms)/1000;
  if(s<3600) return Math.round(s/60)+' min'; if(s<86400) return Math.round(s/3600)+' h';
  return Math.round(s/86400)+' d'; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function fmtn(v){ return v==null?'—':(Math.round(v*10)/10); } const COUNTRY_CANON={'mexico':'México','japon':'Japón','eeuu':'Estados Unidos','ee.uu.':'Estados Unidos'}; function canonCountry(c){ if(c==null||c==='') return c; const k=String(c).toLowerCase().trim(); return COUNTRY_CANON[k]||c; } function tcCategory(kt){ const w=parseFloat(kt); if(!isFinite(w)) return null; if(w>=137) return 'Categoría 5'; if(w>=113) return 'Categoría 4'; if(w>=96) return 'Categoría 3'; if(w>=83) return 'Categoría 2'; if(w>=64) return 'Categoría 1 (huracan)'; if(w>=34) return 'Tormenta tropical'; return 'Depresion tropical'; }

async function loadEarthquakes(){
  const r = await fetch(USGS,{cache:'no-store'});
  const gj = await r.json();
    G.eq.clearLayers(); FEATS.eq=[];
  let n=0;
  gj.features.forEach(f=>{
    const [lon,lat,depth] = f.geometry.coordinates;
    const p = f.properties; const m = p.mag||0; const tsu = p.tsunami===1;
    const recent = (Date.now()-p.time) < 3600000;
    const cm = L.circleMarker([lat,lon],{radius:Math.max(3,m*1.9),color:tsu?C.cyan:eqColor(m),
      weight:1.4, fillColor:eqColor(m), fillOpacity:.35});
    cm.bindPopup(eqPopup(p,depth,tsu,m));
        cm.addTo(G.eq); n++; FEATS.eq.push({lat:lat,lon:lon,props:p,marker:cm});
    if(tsu || m>=4.5 || recent){
            const pm=L.marker([lat,lon],{icon:pingIcon(tsu?'tsu':'')}).addTo(G.eq).bindPopup(eqPopup(p,depth,tsu,m)); FEATS.eq.push({lat:lat,lon:lon,props:p,marker:pm});
    }
    if(m>=4.5 || tsu){
      threats.push({score:(tsu?100:0)+m*10, kind:'SISMO', color:eqColor(m), sev:m.toFixed(1),
        title:(tsu?'⚠ TSUNAMI · ':'')+esc(p.place||'Sismo'), meta:fmtAgo(p.time)+' · prof '+Math.round(depth)+' km',
        lat, lon, country:sismoCountry(p.place)});
    }
  });
    // Detección de posibles enjambres sísmicos en México (heurística por grilla ~50km)
  const gridDeg = 0.45;
  const swarmCells = {};
  gj.features.forEach(function(f2){
    const lon2=f2.geometry.coordinates[0], lat2=f2.geometry.coordinates[1];
    if(lat2<14.0 || lat2>33.0 || lon2<-119 || lon2>-85) return;
    const key = Math.round(lat2/gridDeg)+'_'+Math.round(lon2/gridDeg);
    (swarmCells[key] = swarmCells[key]||[]).push({lat:lat2,lon:lon2,mag:f2.properties.mag||0,place:f2.properties.place||''});
  });
  Object.values(swarmCells).forEach(function(cell){
    if(cell.length < 5) return;
    const clat = cell.reduce(function(s,c){return s+c.lat;},0)/cell.length;
    const clon = cell.reduce(function(s,c){return s+c.lon;},0)/cell.length;
    const maxMag = Math.max.apply(null, cell.map(function(c){return c.mag;})); const rep = cell.slice().sort(function(a,b){return b.mag-a.mag;})[0]; const swCountry = canonCountry(sismoCountry(rep.place)); const finalCountry = (swCountry && swCountry!=='No determinado') ? swCountry : 'México';
    const circ = L.circle([clat,clon],{radius:50000,color:C.orange,weight:1.4,dashArray:'4 5',fill:false,interactive:false}).addTo(G.eq);
    circ.bindPopup('<div class="pp"><span class="ptag" style="background:'+C.orange+'">POSIBLE ENJAMBRE SÍSMICO</span>'+
      '<div><span class="k">Eventos agrupados:</span> <b>'+cell.length+'</b></div>'+
      '<div><span class="k">Magnitud máxima:</span> <b>'+maxMag.toFixed(1)+'</b></div>'+
      '<div class="cnote" style="margin-top:5px">Detección heurística por agrupación geográfica (USGS, últimas 24 h). No sustituye el análisis oficial del SSN.</div></div>');
    FEATS.eq.push({lat:clat,lon:clon,props:{},marker:circ});
    threats.push({score:60+cell.length*2, kind:'ENJAMBRE', color:C.orange, sev:cell.length+'x',
      title:'Posible enjambre sísmico ('+cell.length+' eventos)', meta:'Mag. máx '+maxMag.toFixed(1),
      lat:clat, lon:clon, country:finalCountry});
  });
counts.eq=n; document.getElementById('cnt-eq').textContent=n;
}
function eqPopup(p,depth,tsu,m){
  return `<div class="pp"><span class="ptag" style="background:${eqColor(m)}">SISMO M${m.toFixed(1)}</span>
    ${tsu?'<span class="ptag" style="background:'+C.cyan+';margin-left:5px">AVISO TSUNAMI</span>':''}
    <h3>${esc(p.place||'Evento sísmico')}</h3>
    <div><span class="k">Magnitud:</span> <b>${m.toFixed(1)}</b></div>
    <div><span class="k">Profundidad:</span> <b>${Math.round(depth)} km</b></div>
    <div><span class="k">Hace:</span> <b>${fmtAgo(p.time)}</b></div>
    <div style="margin-top:6px"><a href="${p.url}" target="_blank" rel="noopener">Detalle USGS ↗</a></div></div>`;
}

async function loadStormTracks(){
  try{
    const gj = await (await fetch('./data/storm_tracks.geojson',{cache:'no-store'})).json();
    (gj.features||[]).forEach(function(f){
      const p = f.properties||{};
      if(f.geometry.type==='LineString'){
        const latlngs = f.geometry.coordinates.map(function(c){return [c[1],c[0]];});
        const isForecast = p.kind==='forecast';
        const pl = L.polyline(latlngs,{color:isForecast?C.amber:C.cyan, weight:isForecast?2:2.5,
          dashArray:isForecast?'6 6':null, opacity:.85}).addTo(G.storms);
        const mid = latlngs[Math.floor(latlngs.length/2)] || latlngs[0] || [0,0];
        FEATS.storms.push({lat:mid[0], lon:mid[1], props:p, marker:pl});
      } else if(f.geometry.type==='Point'){
        const lon=f.geometry.coordinates[0], lat=f.geometry.coordinates[1];
        const isForecastPt = p.kind==='forecast_point';
        const isPastPt = p.kind==='past_point';
        if(!isForecastPt && !isPastPt) return;
        const color = isForecastPt ? C.amber : C.muted;
        const m = L.circleMarker([lat,lon],{radius:4,color:color, weight:1.4, fillColor:color, fillOpacity:.7}).addTo(G.storms);
        let popup;
        if(isForecastPt){
          popup = '<div class="pp"><span class="ptag" style="background:'+C.amber+'">PRONÓSTICO '+esc(p.label||'')+'</span>'+
            '<h3>'+esc(p.storm_name||'')+'</h3>'+
            '<div><span class="k">Categoría:</span> <b>'+esc(p.category||'')+'</b></div>'+
            '<div><span class="k">Vientos:</span> <b>'+esc(p.wind_kt||'—')+' kt</b></div>'+
            '<div><span class="k">Válido:</span> <b>'+esc(p.valid_text||'')+'</b></div></div>';
        } else {
          popup = '<div class="pp"><span class="ptag" style="background:'+C.muted+'">HACE '+esc(p.hours_ago)+' h</span>'+
            '<h3>'+esc(p.storm_name||'')+'</h3>'+
            '<div><span class="k">Categoría:</span> <b>'+esc(p.category||'')+'</b></div>'+
            '<div><span class="k">Vientos:</span> <b>'+esc(p.wind_kt||'—')+' kt</b></div></div>';
        }
        m.bindPopup(popup);
        FEATS.storms.push({lat:lat,lon:lon,props:p,marker:m});
      }
    });
  }catch(e){ /* capa opcional: silencioso si falla */ }
}
function gdacsLayer(f){
  const [lon,lat]=f.geometry.coordinates, p=f.properties;
  const lvl=(p.alertlevel||'Green').toLowerCase();

// ---- FEED de titulares ----
function fmtDate(s){
  if(!s) return '';
  if(/^\d{8}T/.test(s)) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); // GDELT
  const d=new Date(s); return isNaN(d)?String(s).slice(0,16):d.toLocaleDateString('es-MX',{month:'short',day:'numeric'});
}
function feedDate(s){
  if(!s) return 0;
  if(/^\d{8}T/.test(s)){
    const iso = s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(9,11)+':'+s.slice(11,13)+':'+s.slice(13,15)+'Z';
    const d0 = Date.parse(iso); return isNaN(d0)?0:d0;
  }
  const d=new Date(s); return isNaN(d)?0:d.getTime();
}
async function loadFeed(){
  try{
    const fd=await (await fetch('./data/security_feed.json',{cache:'no-store'})).json();
    const items=(fd.items||[]).slice().sort((a,b)=>feedDate(b.date)-feedDate(a.date)).slice(0,15);
    document.getElementById('feed').innerHTML='<div class="ch">FEED DE SEGURIDAD</div>'+
      (items.length ? items.map(i=>`<a class="fitem" href="${esc(i.url)}" target="_blank" rel="noopener">${esc((i.title||'').slice(0,95))}<span class="fs">${esc(i.source||'')} · ${esc(fmtDate(i.date))} · señal, verifica</span></a>`).join('')
        : '<div class="cnote">Sin señales por ahora. Se llena en la próxima actualización.</div>');
  }catch(e){ document.getElementById('feed').innerHTML='<div class="ch">FEED DE SEGURIDAD</div><div class="cnote">Pendiente de la primera actualización.</div>'; }
}

// ---- CONSOLA DE ZONA ----
const ADV_LABEL={0:['Sin dato oficial',C.muted],1:['NIVEL 1 · Precaución normal',C.green],
  2:['NIVEL 2 · Mayor precaución','#ffd23f'],3:['NIVEL 3 · Reconsiderar viaje',C.orange],
  4:['NIVEL 4 · No viajar',C.red]};
function haversine(la1,lo1,la2,lo2){const R=6371,r=x=>x*Math.PI/180;
  const dLa=r(la2-la1),dLo=r(lo2-lo1);
  const s=Math.sin(dLa/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));}

function clearZoneFilter(){
  ZONE_FILTER=null;
  if(zoneCircle){ map.removeLayer(zoneCircle); zoneCircle=null; }
  Object.keys(FEATS).forEach(function(id){
    const grp=G[id]; if(!grp) return;
    grp.clearLayers();
    FEATS[id].forEach(function(it){ it.marker.addTo(grp); });
    const el=document.getElementById('cnt-'+id); if(el) el.textContent = FEATS[id].length;
  });
  renderThreats();
  const zres=document.getElementById('zres');
  if(zres) zres.innerHTML='Escribe un destino para ver su nivel de riesgo oficial, avisos y señales cercanas.';
}

function applyZoneFilter(lat,lon,label){
  ZONE_FILTER={lat:lat,lon:lon,radius:RADIUS_KM,label:label};
  if(zoneCircle) map.removeLayer(zoneCircle);
  zoneCircle=L.circle([lat,lon],{radius:RADIUS_KM*1000,color:C.amber,weight:1.4,dashArray:'5 6',fill:false,interactive:false}).addTo(map);
  Object.keys(FEATS).forEach(function(id){
    const grp=G[id]; if(!grp) return;
    grp.clearLayers();
    let n=0;
    FEATS[id].forEach(function(it){ if(haversine(lat,lon,it.lat,it.lon)<=RADIUS_KM){ it.marker.addTo(grp); n++; } });
    const el=document.getElementById('cnt-'+id); if(el) el.textContent=n;
  });
  map.flyTo([lat,lon], Math.max(map.getZoom(),7), {duration:.8});
  renderThreats();
}

function nearFeats(id,lat,lon){
  return (FEATS[id]||[]).filter(function(it){ return haversine(lat,lon,it.lat,it.lon)<=RADIUS_KM; });
}

function zoneSummaryHTML(lat,lon){
  const nearEq=nearFeats('eq',lat,lon), nearStorms=nearFeats('storms',lat,lon), nearGdacs=nearFeats('gdacs',lat,lon),
    nearFires=nearFeats('fires',lat,lon), nearVolc=nearFeats('volcano',lat,lon), nearSec=nearFeats('security',lat,lon),
    nearFc=nearFeats('forecast',lat,lon), nearAir=nearFeats('air',lat,lon);
  let maxMag=null; nearEq.forEach(function(it){ const m=it.props.mag||0; if(maxMag===null||m>maxMag) maxMag=m; });
  let fc=null; nearFc.forEach(function(it){ if(!fc||(it.props.level||0)>(fc.props.level||0)) fc=it; });
  let air=null; nearAir.forEach(function(it){ if(!air||(it.props.level||0)>(air.props.level||0)) air=it; });
  let html='';
  html+='<div class="cnote"><b style="color:'+(nearEq.length?C.amber:C.green)+'">'+nearEq.length+'</b> sismo(s)'+(maxMag?' · máx M'+maxMag.toFixed(1):'')+
    ' · <b style="color:'+(nearFires.length?C.orange:C.green)+'">'+nearFires.length+'</b> incendio(s)'+
    ' · <b style="color:'+(nearStorms.length?C.cyan:C.green)+'">'+nearStorms.length+'</b> ciclón(es)'+
    ' · <b style="color:'+(nearVolc.length?C.violet:C.green)+'">'+nearVolc.length+'</b> volcán(es)</div>';
  if(nearGdacs.length) html+='<div class="cnote"><b style="color:'+C.orange+'">'+nearGdacs.length+'</b> alerta(s) GDACS (multi-amenaza) cerca</div>';
  if(fc) html+='<div class="cnote">Pronóstico 7d más cercano ('+esc(fc.props.name)+'): <b>'+esc(fc.props.level_label)+'</b> · '+fc.props.max_rain_mm+'mm · '+fc.props.max_gust_kmh+'km/h</div>';
  else html+='<div class="cnote">Sin punto de pronóstico cercano en el GRID.</div>';
  if(air) html+='<div class="cnote">Calidad del aire más cercana ('+esc(air.props.name)+'): <b style="color:'+air.props.color+'">'+esc(air.props.level_label)+'</b> (AQI '+(air.props.us_aqi==null?'—':air.props.us_aqi)+')</div>';
  else html+='<div class="cnote">Sin punto de calidad del aire cercano en el GRID.</div>';
  html+='<div class="cnote"><b style="color:'+(nearSec.length?C.orange:C.green)+'">'+nearSec.length+'</b> señal(es) de seguridad en noticias cerca (24 h) · <b>no confirmadas</b></div>';
  return html;
}

async function queryZone(){
  const q=document.getElementById('zq').value.trim(); if(!q) return;
  const res=document.getElementById('zres'); res.textContent='Buscando…';
  try{
    const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=es')).json();
    const r=(g.results||[])[0];
    if(!r){ res.textContent='No encontré ese lugar. Prueba otro nombre.'; return; }
    const lat=r.latitude, lon=r.longitude, cc=r.country_code;
    applyZoneFilter(lat,lon,r.name);
    const adv=advisories[cc]||{level:0};
    const albl=ADV_LABEL[adv.level||0][0], acol=ADV_LABEL[adv.level||0][1];
    const summary=zoneSummaryHTML(lat,lon);
    const popupHtml='<div class="pp"><h3>'+esc(r.name)+'</h3><div class="k">'+esc(r.admin1||'')+' · '+esc(r.country||'')+'</div>'
      +'<div class="advbig" style="color:'+acol+';margin-top:6px">'+esc(albl)+'</div>'+summary+'</div>';
    L.popup({maxWidth:280}).setLatLng([lat,lon]).setContent(popupHtml).openOn(map);
    const gnews='https://news.google.com/search?q='+encodeURIComponent(r.name+' seguridad OR bloqueo OR asalto')+'&hl=es-419&gl=MX';
    let html='';
    html+='<div class="advbig" style="color:'+acol+'">'+esc(albl)+'</div>';
    if(adv.message) html+='<div class="cnote">'+esc(adv.message.slice(0,180))+'</div>';
    html+='<div class="cnote">Filtro de zona activo: radio <b>'+RADIUS_KM+' km</b> alrededor de '+esc(r.name)+'. <a id="zclear" style="color:'+C.amber+';cursor:pointer">Quitar filtro ✕</a></div>';
    html+=summary;
    html+='<div class="cnote"><a href="'+gnews+'" target="_blank" rel="noopener">Noticias de '+esc(r.name)+' ↗</a>'+(adv.source?(' · <a href="'+esc(adv.source)+'" target="_blank" rel="noopener">Aviso oficial ↗</a>'):'')+'</div>';
    html+='<div class="cnote" style="font-size:9px">Riesgo: travel-advisory.info (varios gobiernos). Verifica siempre los avisos oficiales de tu país. El filtro de zona usa distancia en línea recta (~'+RADIUS_KM+' km).</div>';
    res.innerHTML=html;
    const zc=document.getElementById('zclear'); if(zc) zc.onclick=clearZoneFilter;
    if(window.matchMedia('(max-width:820px)').matches){
      document.getElementById('pleft').classList.add('hide');
      document.getElementById('pright').classList.remove('hide');
    }
  }catch(e){ res.textContent='Error de red al consultar. Intenta de nuevo.'; }
}

    <div class="k" style="margin-top:5px">${esc(p.note||'')}</div>
    ${p.ash_active?`<div style="margin-top:5px"><span class="k">Ceniza:</span> <b>FL${esc(p.ash_fl)} (${esc(p.ash_top_ft)} ft)</b></div>
    <div><span class="k">Dirección:</span> <b>${esc(p.ash_dir||'—')}</b> · <span class="k">Vel:</span> <b>${esc(p.ash_spd||'—')} kt</b></div>`:''}
    <div class="cnote" style="margin-top:5px">${esc(p.ash_note||'')}</div>
    <div style="margin-top:6px"><a href="${esc(p.url)}" target="_blank" rel="noopener">Fuente oficial ↗</a></div></div>`);
  if(p.ash_active){
    threats.push({score:70, kind:'CENIZA', color:C.orange, sev:'VA',
      title:'Ceniza volcánica · '+esc(p.name), meta:'FL'+esc(p.ash_fl)+' · hacia '+esc(p.ash_dir||'—'),
      lat, lon, country:esc(p.country)});
  }
  return m;
}

// ============================ THREAT BOARD ============================
function renderThreats(){
  threats.sort(function(a,b){return b.score-a.score;});
  const box=document.getElementById('threats');
  let list=threats;
  if(ZONE_FILTER){
    list=threats.filter(function(t){ return (t.lat===0&&t.lon===0) || haversine(ZONE_FILTER.lat,ZONE_FILTER.lon,t.lat,t.lon)<=ZONE_FILTER.radius; });
  }
      const countrySel=document.getElementById('countryFilterSel');
    if(countrySel){
      const countries=[...new Set(list.map(function(t){return canonCountry(t.country)||'No determinado';}))].sort(function(a,b){return a.localeCompare(b,'es');});
      const prevSel=countrySel.value;
      countrySel.innerHTML='<option value="">Todos los países</option>'+countries.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
      if(countries.indexOf(prevSel)>=0){ countrySel.value=prevSel; } else { COUNTRY_FILTER=null; }
      countrySel.onchange=function(){ COUNTRY_FILTER=this.value||null; renderThreats(); };
    }
    if(COUNTRY_FILTER){ list=list.filter(function(t){return (canonCountry(t.country)||'No determinado')===COUNTRY_FILTER;}); }
  document.getElementById('threat-ct').textContent=list.length;
  const tag=document.getElementById('threat-filter-tag');
  if(tag){
    if(ZONE_FILTER){ tag.style.display='inline'; tag.textContent='✕ '+ZONE_FILTER.label; tag.onclick=clearZoneFilter; }
    else{ tag.style.display='none'; tag.textContent=''; tag.onclick=null; }
  }
  if(!list.length){
    box.innerHTML='<div class="empty">'+(ZONE_FILTER? 'Sin amenazas activas cerca de '+esc(ZONE_FILTER.label)+'.<br>Vigilancia nominal en la zona.' : 'Sin amenazas activas de nivel medio o alto.<br>Vigilancia nominal.')+'</div>';
  } else {
    box.innerHTML='';
    list.slice(0,40).forEach(function(t){
      const b=document.createElement('button'); b.className='threat';
      b.innerHTML='<div class="top"><span class="tag" style="background:'+t.color+'">'+t.kind+'</span>'
        +'<span class="ttl">'+t.title+'</span><span class="sev" style="color:'+t.color+'">'+t.sev+'</span></div>'
        +'<div class="meta">'+t.meta+'</div>';
      b.onclick=function(){ map.flyTo([t.lat,t.lon], Math.max(map.getZoom(),6), {duration:.8});
        if(window.matchMedia('(max-width:820px)').matches){ document.getElementById('pright').classList.add('hide'); } };
      box.appendChild(b);
    });
  }
  // ticker (siempre global, no filtrado por zona)
  const tx = threats.slice(0,8).map(function(t){return t.kind+': '+t.title;}).join(' · ');
  document.getElementById('ticker').innerHTML = tx
    ? ('<b>● EN VIVO</b> '+esc(tx)+' · ').repeat(2)
    : '<b>● VIGILANCIA NOMINAL</b> · fuentes: USGS · NOAA · NASA FIRMS · Open-Meteo · GDACS';
}


// ============================ CICLO DE ACTUALIZACIÓN ============================
function setStatus(txt, err){
  const s=document.getElementById('status'); s.classList.toggle('err',!!err);
  document.getElementById('status-tx').textContent=txt;
}
async function refreshLive(){
  threats = threats.filter(t=>t.kind!=='SISMO' && t.kind!=='ENJAMBRE'); // re-evaluar sismos y enjambres
  try{ await loadEarthquakes(); setStatus('SINCRONIZADO'); }
  catch(e){ setStatus('ERROR SISMOS — reintentando', true); }
  if(map.hasLayer(G.alerts)) await loadAlerts();
  renderThreats();
}
async function init(){
  buildLayerUI();
  setStatus('CARGANDO…');
  await loadBaked();           // capas 2x/día
  await refreshLive();         // sismos/alertas en vivo
  renderThreats();
  setInterval(refreshLive, LIVE_REFRESH);
  let t=LIVE_REFRESH/1000;
  setInterval(()=>{ t--; if(t<=0)t=LIVE_REFRESH/1000;
    const s=document.getElementById('status-tx');
    if(s && s.textContent==='SINCRONIZADO') s.textContent='SYNC EN '+t+'s'; },1000);
}

// ============================ RELOJES ============================
function tickClocks(){
  const now=new Date();
  const fmt=tz=>new Intl.DateTimeFormat('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit',
    hour12:false,timeZone:tz}).format(now);
  document.getElementById('clk-mx').textContent=fmt('America/Mexico_City');
  document.getElementById('clk-utc').textContent=fmt('UTC');
}
setInterval(tickClocks,1000); tickClocks();

// toggles móviles
document.getElementById('tog-l').onclick=()=>document.getElementById('pleft').classList.toggle('hide');
document.getElementById('tog-r').onclick=()=>document.getElementById('pright').classList.toggle('hide');
if(window.matchMedia('(max-width:820px)').matches){ document.getElementById('pleft').classList.add('hide'); }

// re-cargar alertas NWS si el usuario enciende la capa
const origAdd = map.addLayer.bind(map);
map.addLayer = function(layer){ const r=origAdd(layer); if(layer===G.alerts) loadAlerts().then(renderThreats); return r; };

// consola de zona
document.getElementById('zgo').onclick=queryZone;
document.getElementById('zq').addEventListener('keydown',e=>{ if(e.key==='Enter') queryZone(); });

init();
</script>
